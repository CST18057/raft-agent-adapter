name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build Windows stdio launcher and smoke-test the full chain
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./platform/windows/Build.ps1
          node scripts/fake-peer-config.mjs "$env:TEMP/raft-adapter-fake.json"
          $env:RAFT_ADAPTER_CONFIG = "$env:TEMP/raft-adapter-fake.json"
          $env:MOCK_STATE_FILE = "$env:TEMP/raft-adapter-fake-sessions.json"
          node scripts/smoke.mjs --launcher
      - name: Build Linux launcher and smoke-test the full chain
        if: runner.os == 'Linux'
        run: |
          platform/linux/build.sh
          node scripts/fake-peer-config.mjs /tmp/raft-adapter-fake.json
          RAFT_ADAPTER_CONFIG=/tmp/raft-adapter-fake.json MOCK_STATE_FILE=/tmp/raft-adapter-fake-sessions.json node scripts/smoke.mjs --launcher
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Linux dev/verification image without external downloads
        run: docker build -f docker/Dockerfile --build-arg INSTALL_DEVIN=0 --build-arg INSTALL_RAFT=0 -t raft-agent-adapter .
