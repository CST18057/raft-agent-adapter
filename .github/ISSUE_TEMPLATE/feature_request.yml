name: Feature request / 功能建议
description: Describe a concrete workflow that could be improved.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Workflow and problem / 使用场景与问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior / 建议的行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and constraints / 替代方案与约束
